<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mehmet & Fatma — Nişan Töreni</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f1e8}body{font-family:Georgia,'Times New Roman',serif;color:#7b572d}.screen{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#fffdf8 0,#f8efe2 63%,#ead7bd 100%)}.frame{position:absolute;inset:3.2vh 2.2vw;border:2px solid rgba(179,129,61,.65)}.frame:before{content:"";position:absolute;inset:10px;border:1px solid rgba(179,129,61,.28)}.content{text-align:center;z-index:2;transform:translateY(-1vh)}.kicker{font-family:Arial,sans-serif;font-size:clamp(18px,2vw,38px);letter-spacing:.34em;text-transform:uppercase;color:#a8783d;margin-bottom:2.5vh}.names{font-size:clamp(70px,11vw,210px);font-weight:400;line-height:.95;letter-spacing:.01em;text-shadow:0 2px 1px #fff}.amp{font-style:italic;color:#b48343;padding:0 .12em}.rule{display:flex;align-items:center;justify-content:center;gap:18px;margin:3.5vh auto 0;width:min(54vw,900px)}.line{height:1px;flex:1;background:linear-gradient(90deg,transparent,#b48343)}.line.r{background:linear-gradient(90deg,#b48343,transparent)}.heart{font-family:Arial,sans-serif;color:#b48343;font-size:clamp(18px,2vw,34px)}.date{font-family:Arial,sans-serif;font-size:clamp(15px,1.45vw,28px);letter-spacing:.22em;color:#8d6a43;margin-top:2.5vh}.corner{position:absolute;width:24vw;height:25vh;opacity:.72}.tl{top:0;left:0}.br{right:0;bottom:0;transform:rotate(180deg)}.stem{position:absolute;width:2px;height:24vh;background:linear-gradient(#b98a52,transparent);transform:rotate(-48deg);left:10vw;top:-2vh;transform-origin:bottom}.leaf{position:absolute;width:5.5vw;height:2.3vw;border:2px solid rgba(175,126,68,.55);border-left:none;border-bottom:none;border-radius:100% 0;transform:rotate(var(--r));left:var(--x);top:var(--y)}.flower{position:absolute;width:10vw;height:10vw;border-radius:50%;background:radial-gradient(circle,#c99b60 0 5%,#fff9ef 6% 24%,rgba(247,229,204,.85) 25% 58%,transparent 60%);filter:drop-shadow(0 6px 12px rgba(130,88,40,.12))}.f1{left:-2vw;top:-2vw}.f2{left:7vw;top:2vw;width:7vw;height:7vw}.hint{position:absolute;bottom:1.1vh;left:50%;transform:translateX(-50%);font:12px Arial,sans-serif;letter-spacing:.08em;color:rgba(100,75,45,.48);z-index:3;white-space:nowrap}.screen.full .hint{display:none}@media(max-width:900px){.names{font-size:12vw}.frame{inset:2vh 2vw}.corner{width:30vw}.hint{font-size:10px}}
</style>
</head>
<body>
<main class="screen" id="screen" aria-label="Mehmet ve Fatma Nişan Töreni">
  <div class="frame"></div>
  <div class="corner tl"><div class="stem"></div><div class="flower f1"></div><div class="flower f2"></div><i class="leaf" style="--x:10vw;--y:4vh;--r:18deg"></i><i class="leaf" style="--x:15vw;--y:9vh;--r:38deg"></i><i class="leaf" style="--x:5vw;--y:15vh;--r:-20deg"></i></div>
  <div class="corner br"><div class="stem"></div><div class="flower f1"></div><div class="flower f2"></div><i class="leaf" style="--x:10vw;--y:4vh;--r:18deg"></i><i class="leaf" style="--x:15vw;--y:9vh;--r:38deg"></i><i class="leaf" style="--x:5vw;--y:15vh;--r:-20deg"></i></div>
  <section class="content">
    <div class="kicker">Nişan Töreni</div>
    <div class="names">Mehmet <span class="amp">&</span> Fatma</div>
    <div class="rule"><span class="line"></span><span class="heart">♥</span><span class="line r"></span></div>
    <div class="date">19 TEMMUZ 2026</div>
  </section>
  <div class="hint">Tam ekran için ekrana bir kez dokunun</div>
</main>
<script>
const screen=document.getElementById('screen');
async function goFull(){
  screen.classList.add('full');
  try{
    const el=document.documentElement;
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
}
document.addEventListener('click',goFull,{once:true});
document.addEventListener('touchend',goFull,{once:true});
</script>
</body>
</html>
